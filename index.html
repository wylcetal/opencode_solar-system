<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interactive Solar System</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- Star background generated by JS -->
  <div id="stars"></div>

  <!-- Main solar system container, centered on screen -->
  <main id="solar-system">

    <!-- The Sun at the center -->
    <div class="sun">
      <span class="label sun-label">Sun</span>
    </div>

    <!-- Each orbit wraps a rotating arm that holds the planet -->
    <div class="orbit" data-planet="mercury">
      <div class="orbit-line"></div>
      <div class="arm">
        <div class="planet mercury"></div>
        <span class="label">Mercury</span>
      </div>
    </div>

    <div class="orbit" data-planet="venus">
      <div class="orbit-line"></div>
      <div class="arm">
        <div class="planet venus"></div>
        <span class="label">Venus</span>
      </div>
    </div>

    <div class="orbit" data-planet="earth">
      <div class="orbit-line"></div>
      <div class="arm">
        <div class="planet earth">
          <!-- Moon orbits around Earth -->
          <div class="moon-orbit">
            <div class="moon"></div>
          </div>
        </div>
        <span class="label">Earth</span>
      </div>
    </div>

    <div class="orbit" data-planet="mars">
      <div class="orbit-line"></div>
      <div class="arm">
        <div class="planet mars"></div>
        <span class="label">Mars</span>
      </div>
    </div>

    <div class="orbit" data-planet="jupiter">
      <div class="orbit-line"></div>
      <div class="arm">
        <div class="planet jupiter"></div>
        <span class="label">Jupiter</span>
      </div>
    </div>

    <div class="orbit" data-planet="saturn">
      <div class="orbit-line"></div>
      <div class="arm">
        <div class="planet saturn">
          <!-- Saturn's ring -->
          <div class="saturn-ring"></div>
        </div>
        <span class="label">Saturn</span>
      </div>
    </div>

    <div class="orbit" data-planet="uranus">
      <div class="orbit-line"></div>
      <div class="arm">
        <div class="planet uranus"></div>
        <span class="label">Uranus</span>
      </div>
    </div>

    <div class="orbit" data-planet="neptune">
      <div class="orbit-line"></div>
      <div class="arm">
        <div class="planet neptune"></div>
        <span class="label">Neptune</span>
      </div>
    </div>
  </main>

  <!-- UI Controls -->
  <nav id="controls">
    <button id="pause-btn" aria-label="Pause or resume animation">Pause</button>
    <label for="speed-slider">Speed</label>
    <input type="range" id="speed-slider" min="0.1" max="5" step="0.1" value="1" />
    <span id="speed-value">1x</span>
  </nav>

  <script src="script.js"></script>
</body>
</html>
